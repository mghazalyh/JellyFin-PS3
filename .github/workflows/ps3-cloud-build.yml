name: PS3 cross-build on GitHub

on:
  push:
    branches:
      - feature/ps3-surf-native-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS3 PKG with pinned GCC 7.2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and verify PS3 SDK on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="$RUNNER_TEMP/ps3-sdk"
          ARCHIVE="$RUNNER_TEMP/ps3dev-linux-X64.tar.gz"
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz' \
            -o "$ARCHIVE"
          echo "dcbed747e094c6a382dae5b0aacc322a1d4390d9f2849a7d750a96ea398ee8ab  $ARCHIVE" | sha256sum -c -
          mkdir -p "$SDK_DIR"
          tar -xzf "$ARCHIVE" -C "$SDK_DIR"
          if test -x "$SDK_DIR/ps3dev/ppu/bin/ppu-g++"; then
            PS3DEV="$SDK_DIR/ps3dev"
          elif test -x "$SDK_DIR/ppu/bin/ppu-g++"; then
            PS3DEV="$SDK_DIR"
          else
            echo "Pinned PS3 SDK archive does not contain ppu-g++ at an expected location" >&2
            find "$SDK_DIR" -maxdepth 4 -name 'ppu-g++' -print >&2
            exit 1
          fi
          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PSL1GHT=$PS3DEV" >> "$GITHUB_ENV"
          echo "PORTLIBS=$PS3DEV/portlibs/ppu" >> "$GITHUB_ENV"
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

      - name: Verify compiler, build PKG, and validate contents
        shell: bash
        run: |
          set -euo pipefail
          ppu-g++ --version | head -n 1
          test "$(ppu-g++ -dumpversion)" = "7.2.0"
          python3 tools/i18n.py check
          make -j4 pkg
          python3 tools/verify_pkg.py
          test -s JellyFin-PS3.gnpdrm.pkg
          sha256sum JellyFin-PS3.gnpdrm.pkg > ps3-github-build.sha256

      - name: Store installable PKG on GitHub (not the Mac Mini)
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-ps3-github-build
          path: |
            JellyFin-PS3.gnpdrm.pkg
            ps3-github-build.sha256
          retention-days: 14
          if-no-files-found: error
